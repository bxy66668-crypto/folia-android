name: Build Folia Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 手动拉取全部嵌套子模块
        run: |
          git submodule init
          git submodule update --init --recursive

      - name: 配置Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装npm依赖
        run: npm install

      - name: Vite打包网页
        run: |
          export FOLIA_DISABLE_PWA=1
          npx vite build

      - name: Capacitor同步安卓
        run: npx cap sync android

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle编译Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: folia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
