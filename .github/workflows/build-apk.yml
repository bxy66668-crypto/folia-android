name: Build Folia Android APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 1.安装npm依赖
        run: npm install

      - name: 2.构建网页产物
        run: |
          export FOLIA_DISABLE_PWA=1
          npx vite build

      - name: 3.同步到Android工程
        run: npx cap sync android

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4.生成调试APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: folia-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
